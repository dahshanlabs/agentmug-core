# Delay newly published dependency versions for one day to reduce exposure to
# supply-chain takeovers. Urgent exceptions require a reviewed allowlist entry.
minimumReleaseAge: 1440

packages:
  - packages/*
  - examples/*

catalog:
  '@types/node': ^25.3.3
  tsx: ^4.23.12

autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild

overrides:
  # Security floors. Same convention as the private root workspace: pin the
  # transitive edge, never the top-level dependency, so raising a floor cannot
  # force a full re-resolution of the tree.
  "@changesets/parse>js-yaml": "4.3.1"
  "read-yaml-file>js-yaml": "3.15.1"
  "@modelcontextprotocol/sdk>@hono/node-server": "2.0.10"
  "@modelcontextprotocol/sdk>hono": "4.12.34"
  "@google/genai>protobufjs": "7.6.5"
  "@google/genai>ws": "8.21.0"
  "@types/node-fetch>form-data": "4.0.6"
  "axios>form-data": "4.0.6"
  "exceljs>uuid": "11.1.1"
  "minimatch>brace-expansion": "5.0.9"
  fast-uri: "3.1.5"
  esbuild: "0.28.1"
